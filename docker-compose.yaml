services:
  bondsight:
    build:
      context: .
      dockerfile: Dockerfile
    image: pro-ki:latest
    network_mode: host
    privileged: true
    container_name: bondsight
    gpus: all
    shm_size: '2gb'
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
    devices:
      - /dev/video6:/dev/video6
    stdin_open: true
    tty: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - .:/bondsight                    
      - ./data:/data                
      - ./models:/models   
    